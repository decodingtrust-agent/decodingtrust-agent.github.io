# /etc/nginx/sites-available/decodingtrust-agent.conf
#
# Production: serves http(s)://decodingtrust-agent.com (+ www.) from this host.
# Apply AFTER:
#   1. DNS A record decodingtrust-agent.com -> 35.193.39.86
#      (and www CNAME to decodingtrust-agent.com)
#   2. GitHub Pages disabled (settings > Pages > None)
#
# Install:
#   sudo cp deploy/nginx-prod.conf /etc/nginx/sites-available/decodingtrust-agent.conf
#   sudo ln -sf /etc/nginx/sites-available/decodingtrust-agent.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then for HTTPS (Let's Encrypt; needs port 80 reachable from the public Internet):
#   sudo certbot --nginx -d decodingtrust-agent.com -d www.decodingtrust-agent.com
# (certbot will rewrite this file to add the listen 443 ssl block + http→https redirect.)
#
# Alternative: put Cloudflare in front (orange cloud). Cloudflare terminates
# TLS at the edge; this server can keep listening on plain :80 and you skip
# certbot. Set Cloudflare SSL/TLS mode = "Full" once both ends speak HTTPS.

upstream dt_next_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Redirect www. → apex (301).
server {
    server_name www.decodingtrust-agent.com;
    return 301 $scheme://decodingtrust-agent.com$request_uri;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/decodingtrust-agent.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/decodingtrust-agent.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name decodingtrust-agent.com;

    client_max_body_size 200M;
    server_tokens off;

    # Let's Encrypt webroot for renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/manifest+json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # Trajectory + benchmark JSON (3.2 G of small files): nginx serves
    # straight from disk, bypassing Next.js. The frontend fetches
    # /data/trajectory-manifest.json and /data/trajectories/**/*.json.
    location /data/ {
        alias /home/zhaorun/decodingtrust-agent.github.io/frontend/public/data/;
        autoindex off;
        sendfile on;
        tcp_nopush on;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Next.js hashed build assets — long cache.
    location /_next/static/ {
        proxy_pass http://dt_next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Auth API → dt-auth (FastAPI on :12000).
    location /auth-api/ {
        proxy_pass http://127.0.0.1:12000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # GitHub deploy webhook -> local Python listener on :9001.
    # Restricted to GitHub's hook IPs (https://api.github.com/meta -> "hooks").
    # HMAC signature is also verified by webhook.py; this is defence-in-depth.
    location = /__hooks/github {
        allow 192.30.252.0/22;
        allow 185.199.108.0/22;
        allow 140.82.112.0/20;
        allow 143.55.64.0/20;
        allow 2a0a:a440::/29;
        allow 2606:50c0::/32;
        # Allow loopback for local testing.
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:9001/github;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Read-only deploy status (loopback only, for ops).
    location = /__hooks/status {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:9001/status;
    }

    # Admin panel — gated by HTTP Basic auth (htpasswd file at
    # /etc/nginx/dt-admin.htpasswd, see deploy/README.md). Same upstream as `/`.
    location /admin {
        auth_basic           "DecodingTrust admin";
        auth_basic_user_file /etc/nginx/dt-admin.htpasswd;

        proxy_pass http://dt_next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Everything else → Next.js on :3000.
    location / {
        proxy_pass http://dt_next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    access_log /var/log/nginx/decodingtrust-agent.access.log;
    error_log  /var/log/nginx/decodingtrust-agent.error.log;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/decodingtrust-agent.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/decodingtrust-agent.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = decodingtrust-agent.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name decodingtrust-agent.com;
    return 404; # managed by Certbot


}
server {
    if ($host = www.decodingtrust-agent.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.decodingtrust-agent.com;
    return 404; # managed by Certbot


}