# /etc/nginx/sites-available/decodingtrust-agent-staging.conf
#
# Temporary IP-only verification on http://35.193.39.86/ before DNS cutover.
# Listens on :80 as the default_server (matches unknown Host headers, incl.
# bare-IP requests) while the existing agentsuite-red.conf keeps claiming
# requests whose Host matches `agentsuite-red.virtueai.cc`.
# :80 is the only public port open in the GCE firewall on this VM; port 8088
# works locally but is blocked externally without a firewall-rule change.
#
# Install:
#   sudo cp deploy/nginx-staging.conf /etc/nginx/sites-available/decodingtrust-agent-staging.conf
#   sudo ln -sf /etc/nginx/sites-available/decodingtrust-agent-staging.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream dt_next_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Generous limits for any future uploads from /admin
    client_max_body_size 200M;
    server_tokens off;

    # gzip — JSON compresses ~5–10x
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/manifest+json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # ---------------------------------------------------------------------
    # Trajectory + benchmark JSON (3.2 G of small files): bypass Next.js,
    # serve straight from disk for max throughput.
    # ---------------------------------------------------------------------
    location /data/ {
        alias /home/zhaorun/decodingtrust-agent.github.io/frontend/public/data/;
        autoindex off;
        sendfile on;
        tcp_nopush on;
        # Long cache; manifest is content-stable, file paths embed timestamp.
        add_header Cache-Control "public, max-age=86400";
        # CORS open: API may be read from other origins (e.g. ngrok preview).
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Next.js static build assets — ok to cache aggressively, hashed names.
    location /_next/static/ {
        proxy_pass http://dt_next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://dt_next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    access_log /var/log/nginx/decodingtrust-agent-staging.access.log;
    error_log  /var/log/nginx/decodingtrust-agent-staging.error.log;
}
